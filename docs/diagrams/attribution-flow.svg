<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="900" viewBox="0 0 1560 900" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif"><defs><marker id="ah-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#2f9e6e"/></marker><marker id="ah-pink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#e05561"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#4285f4"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#8b5cf6"/></marker><marker id="ah-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#e0a13a"/></marker><marker id="ah-cyan" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#2aa5b0"/></marker><marker id="ah-slate" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#8494ab"/></marker><marker id="ah-white" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#c9d3e2"/></marker><filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1b2a4a" flood-opacity="0.10"/></filter></defs><rect width="1560" height="900" fill="#fbfcfe"/><text x="780.0" y="52" text-anchor="middle" font-size="27" font-weight="700" fill="#16203a">TokenLens - attribution flow</text><text x="780.0" y="80" text-anchor="middle" font-size="14.5" fill="#6b7794">Count the usage, rate it against a price book, then attribute every cent to whoever caused it.</text><rect x="50" y="158" width="300" height="232" rx="18" fill="#ffffff" fill-opacity="0.55" stroke="#8494ab" stroke-width="1.5" stroke-dasharray="7 5" stroke-opacity="0.75"/><text x="68" y="149" font-size="13.5" font-weight="700" letter-spacing="0.4" fill="#3d4a63">1 - USAGE IN</text><rect x="70" y="190" width="260" height="69" rx="14" fill="#ddf3f5" stroke="#2aa5b0" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(86,205) scale(0.8750)" fill="none" stroke="#2aa5b0" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.2 5.6L20 11l-5.8 2.4L12 19l-2.2-5.6L4 11l5.8-2.4z"/></g><text x="116" y="221" font-size="16.5" font-weight="700" fill="#136b74">OpenTelemetry</text><text x="87" y="243.0" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">gen_ai.* GenAI spans</text><rect x="70" y="274" width="260" height="69" rx="14" fill="#ddf3f5" stroke="#2aa5b0" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(86,289) scale(0.8750)" fill="none" stroke="#2aa5b0" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 13h6"/><path d="M9 17h4"/></g><text x="116" y="305" font-size="16.5" font-weight="700" fill="#136b74">Usage log</text><text x="87" y="327.0" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">JSONL, one call per line</text><rect x="430" y="158" width="300" height="232" rx="18" fill="#ffffff" fill-opacity="0.55" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="7 5" stroke-opacity="0.75"/><text x="448" y="149" font-size="13.5" font-weight="700" letter-spacing="0.4" fill="#552fae">2 - PRICE BOOK</text><rect x="450" y="190" width="260" height="150" rx="14" fill="#ece5f9" stroke="#8b5cf6" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(466,205) scale(0.8750)" fill="none" stroke="#8b5cf6" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v16"/><path d="M6 8h12"/><path d="M4 18h6l-3-7z"/><path d="M14 18h6l-3-7z"/></g><text x="496" y="221" font-size="16.5" font-weight="700" fill="#552fae">Rate the call</text><text x="467" y="243.0" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">StaticPricing - embedded</text><text x="467" y="260.8" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">FilePricing - date-aware</text><text x="467" y="278.6" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">ChainedPricing - falls back</text><text x="467" y="296.4" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">USD per 1M tokens</text><rect x="810" y="214" width="250" height="136" rx="14" fill="#fde5e7" stroke="#e05561" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(923.0,228) scale(1.0000)" fill="none" stroke="#e05561" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3v5a5 5 0 0 0 5 5h7"/><path d="M6 21v-5a5 5 0 0 1 5-5"/><path d="M15 10l3 3-3 3"/></g><text x="935.0" y="272" text-anchor="middle" font-size="16.5" font-weight="700" fill="#9e2b36">Single pass</text><text x="935.0" y="293.0" text-anchor="middle" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">group by feature,</text><text x="935.0" y="310.8" text-anchor="middle" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">tenant, or model</text><text x="935.0" y="328.6" text-anchor="middle" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">O(dimensions) memory</text><rect x="1140" y="214" width="250" height="118" rx="14" fill="#e2ecfd" stroke="#4285f4" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(1253.0,228) scale(1.0000)" fill="none" stroke="#4285f4" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10"/><path d="M10 20V4"/><path d="M16 20v-7"/><path d="M21 20H3"/></g><text x="1265.0" y="272" text-anchor="middle" font-size="16.5" font-weight="700" fill="#17509f">Per-dimension</text><text x="1265.0" y="293.0" text-anchor="middle" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">calls, tokens, cost,</text><text x="1265.0" y="310.8" text-anchor="middle" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">avg latency</text><path d="M330,273 L446,273" stroke="#2aa5b0" stroke-width="2.0" fill="none" marker-end="url(#ah-cyan)"/><rect x="352.8" y="261.0" width="70.4" height="24.0" rx="12" fill="#ffffff" stroke="#2aa5b0" stroke-opacity="0.4"/><text x="388.0" y="277.44" text-anchor="middle" font-size="12" font-weight="600" fill="#136b74">records</text><path d="M714,273 L806,273" stroke="#8b5cf6" stroke-width="2.0" fill="none" marker-end="url(#ah-purple)"/><rect x="737.112" y="261.0" width="45.775999999999996" height="24.0" rx="12" fill="#ffffff" stroke="#8b5cf6" stroke-opacity="0.4"/><text x="760.0" y="277.44" text-anchor="middle" font-size="12" font-weight="600" fill="#552fae">cost</text><path d="M1064,273 L1136,273" stroke="#e05561" stroke-width="2.0" fill="none" marker-end="url(#ah-pink)"/><rect x="50" y="500" width="1440" height="214" rx="18" fill="#ffffff" fill-opacity="0.55" stroke="#8494ab" stroke-width="1.5" stroke-dasharray="7 5" stroke-opacity="0.75"/><text x="68" y="491" font-size="13.5" font-weight="700" letter-spacing="0.4" fill="#3d4a63">3 - WHAT YOU GET</text><rect x="74" y="534" width="320" height="156" rx="14" fill="#e3f5ec" stroke="#2f9e6e" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(90,549) scale(0.8750)" fill="none" stroke="#2f9e6e" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5L21 21"/></g><text x="120" y="565" font-size="16.5" font-weight="700" fill="#186547">Attribution</text><text x="91" y="587.0" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">Which feature tripled</text><text x="91" y="604.8" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">its spend this week?</text><text x="91" y="622.6" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">Which tenant is</text><text x="91" y="640.4" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">unprofitable?</text><rect x="424" y="534" width="320" height="156" rx="14" fill="#fdf1d6" stroke="#e0a13a" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(440,549) scale(0.8750)" fill="none" stroke="#e0a13a" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></g><text x="470" y="565" font-size="16.5" font-weight="700" fill="#8c5a0d">Budget gate</text><text x="441" y="587.0" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">Non-zero exit when</text><text x="441" y="604.8" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">total cost exceeds</text><text x="441" y="622.6" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">the budget - drop it</text><text x="441" y="640.4" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">straight into CI.</text><rect x="774" y="534" width="320" height="156" rx="14" fill="#fde5e7" stroke="#e05561" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(790,549) scale(0.8750)" fill="none" stroke="#e05561" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l9 16H3z"/><path d="M12 9v5"/><path d="M12 17.2v.1"/></g><text x="820" y="565" font-size="16.5" font-weight="700" fill="#9e2b36">Anomalies</text><text x="791" y="587.0" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">Cost above N x the</text><text x="791" y="604.8" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">median dimension.</text><text x="791" y="622.6" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">Median, not mean, so</text><text x="791" y="640.4" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">one whale cannot hide.</text><rect x="1124" y="534" width="342" height="156" rx="14" fill="#ddf3f5" stroke="#2aa5b0" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(1140,549) scale(0.8750)" fill="none" stroke="#2aa5b0" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10a6 6 0 0 1 6-6h8"/><path d="M15 1l3 3-3 3"/><path d="M20 14a6 6 0 0 1-6 6H6"/><path d="M9 23l-3-3 3-3"/></g><text x="1170" y="565" font-size="16.5" font-weight="700" fill="#136b74">Creep</text><text x="1141" y="587.0" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">Recent window vs an</text><text x="1141" y="604.8" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">earlier baseline, as a</text><text x="1141" y="622.6" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">rate. Catches a slow</text><text x="1141" y="640.4" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">ramp the median misses.</text><path d="M1265,336 L1265.0,405.0 Q1265,420 1250.0,420.0 L249.0,420.0 Q234,420 234.0,435.0 L234,530" stroke="#4285f4" stroke-width="2.0" fill="none" marker-end="url(#ah-blue)"/><rect x="735.024" y="408.0" width="49.952" height="24.0" rx="12" fill="#ffffff" stroke="#4285f4" stroke-opacity="0.4"/><text x="760" y="424.44" text-anchor="middle" font-size="12" font-weight="600" fill="#17509f">stats</text><path d="M1265,336 L1265.0,405.0 Q1265,420 1250.0,420.0 L599.0,420.0 Q584,420 584.0,435.0 L584,530" stroke="#4285f4" stroke-width="2.0" fill="none" marker-end="url(#ah-blue)"/><path d="M1265,336 L1265.0,405.0 Q1265,420 1250.0,420.0 L949.0,420.0 Q934,420 934.0,435.0 L934,530" stroke="#4285f4" stroke-width="2.0" fill="none" marker-end="url(#ah-blue)"/><path d="M1265,336 L1265.0,405.0 Q1265,420 1280.0,420.0 L1280.0,420.0 Q1295,420 1295.0,435.0 L1295,530" stroke="#4285f4" stroke-width="2.0" fill="none" marker-end="url(#ah-blue)"/><rect x="50" y="744" width="700" height="76.8" rx="11" fill="#eef1f6" stroke="#8494ab" stroke-width="1.4" stroke-opacity="0.8"/><text x="66" y="768" font-size="13.2" font-weight="700" fill="#3d4a63">Two rules every port matches exactly</text><text x="66" y="790" font-size="12.4" fill="#3d4a63" fill-opacity="0.92">The median is the upper-middle element: [1, 1, 10, 40] has median 10.</text><text x="66" y="808.4" font-size="12.4" fill="#3d4a63" fill-opacity="0.92">A timestamp of 0 means untimed, and the creep detector skips it.</text><rect x="790" y="744" width="700" height="76.8" rx="11" fill="#e3f5ec" stroke="#2f9e6e" stroke-width="1.4" stroke-opacity="0.8"/><text x="806" y="768" font-size="13.2" font-weight="700" fill="#186547">Six languages, one behaviour</text><text x="806" y="790" font-size="12.4" fill="#186547" fill-opacity="0.92">Python, Go, Rust, C#, Java, TypeScript - same arithmetic, same answers.</text><text x="806" y="808.4" font-size="12.4" fill="#186547" fill-opacity="0.92">Pricing is config, not code: swap the book without touching the math.</text><text x="780.0" y="882" text-anchor="middle" font-size="12" fill="#6b7794">parag-labs/token-lens</text></svg>