name: Publish to PyPI

# Publishes the Python package to PyPI using PyPI Trusted Publishing (OIDC) -
# no API token/secret is stored. Trigger manually, or it runs when a GitHub
# Release is published.
#
# One-time PyPI setup (https://pypi.org/manage/account/publishing/):
#   PyPI Project Name: token-lens
#   Owner:             parag-labs
#   Repository name:   token-lens
#   Workflow name:     publish.yml
#   Environment:       (leave blank)

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pypi:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # required for Trusted Publishing (OIDC)
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist
